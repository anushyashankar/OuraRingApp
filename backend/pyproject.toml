[project]
name = "oura-ring-app-backend"
version = "0.1.0"
description = "Advanced Oura Health Intelligence Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "google-generativeai>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "isort>=5.13",
]

[tool.pytest.ini_options]
# only tests/ -- test_sync.py and test_sync_real.py at the root are manual scripts
# that hit the live Oura API and must never run as part of the suite
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # google.generativeai is deprecated upstream; the notice is noise in test output
    "ignore:(?s).*google.generativeai:FutureWarning",
    # fastapi's TestClient re-exports starlette's, which nags about httpx2
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
